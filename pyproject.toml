[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-acbf"
dynamic = ["version"]
authors = [
  { name="Chia-Hao Lee", email="cl2696@cornell.edu" },
]
description = "GPU-based Bright-field Ptychography Solver for tcBF and acBF, compatible with PtyRAD"
keywords = ["Ptychography"]
readme = "README.md"
license = "LGPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "psutil",
    "scipy",
    "torch>=2.4",
    "torchvision",
]
# No PtyRAD dependency: the few PtyRAD pieces fast-acbf needs are ported
# (fast_acbf.core.ptyrad_aberrations and the marked blocks in core/functional.py and
# vis/plotting.py); tests/test_ptyrad_port.py checks them against PtyRAD when installed.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "fast_acbf.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "zarr>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "regression: tests requiring real data fixtures (skip with -m 'not regression')",
]
filterwarnings = ["ignore::UserWarning"]

[project.urls]
Repository = "https://github.com/chiahao3/fast-acbf"
Changelog = "https://github.com/chiahao3/fast-acbf/blob/main/CHANGELOG.md"
"PtyRAD" = "https://github.com/chiahao3/ptyrad"